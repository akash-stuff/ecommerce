services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks: [edge, internal]

  migrate:
    build:
      context: ./ecommerce-backend
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    restart: 'no'
    networks: [internal]

  backend:
    build:
      context: ./ecommerce-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?set PLATFORM_DOMAIN}
      PLATFORM_ADMIN_HOSTS: ${PLATFORM_ADMIN_HOSTS:?set PLATFORM_ADMIN_HOSTS}
      PLATFORM_INGRESS_TARGET: ${PLATFORM_INGRESS_TARGET}
      PLATFORM_INGRESS_IP: ${PLATFORM_INGRESS_IP}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_ALLOW_TENANT_SUBDOMAINS: 'true'
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?required}
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:4000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]

  frontend:
    build:
      context: ./ecommerce-frontend
      args:
        VITE_API_URL: https://{host}/api/v1
        VITE_STORE_DOMAIN: ${PLATFORM_DOMAIN}
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - redis_data:/data
    networks: [internal]

volumes:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  internal:
