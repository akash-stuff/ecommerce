# Production stack.
#
# Caddy receives traffic from the existing host Nginx on 127.0.0.1:8080.
# PostgreSQL runs on a separate external database server and is accessed
# through DATABASE_URL.
# Redis remains private inside the Docker network.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d

services:

  # ---------------------------------------------------------------------------
  # Caddy
  # ---------------------------------------------------------------------------
  # Host Nginx owns ports 80/443.
  # Nginx forwards ecommerce traffic to 127.0.0.1:8080.
  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?set PLATFORM_DOMAIN}
      DNS_PROVIDER: ${DNS_PROVIDER:?set DNS_PROVIDER}
      DNS_API_TOKEN: ${DNS_API_TOKEN:?set DNS_API_TOKEN}
    depends_on:
      - backend
      - frontend
    networks:
      - edge
      - internal

  # ---------------------------------------------------------------------------
  # Database migration
  # ---------------------------------------------------------------------------
  # PostgreSQL is external.
  # DATABASE_URL points to the external PostgreSQL server.
  migrate:
    build:
      context: ./ecommerce-backend
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    restart: 'no'
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./ecommerce-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000

      # External PostgreSQL
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}

      # Internal Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      # Authentication
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}

      # Platform
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?set PLATFORM_DOMAIN}
      PLATFORM_ADMIN_HOSTS: ${PLATFORM_ADMIN_HOSTS:?set PLATFORM_ADMIN_HOSTS}
      PLATFORM_INGRESS_TARGET: ${PLATFORM_INGRESS_TARGET}
      PLATFORM_INGRESS_IP: ${PLATFORM_INGRESS_IP}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_ALLOW_TENANT_SUBDOMAINS: 'true'

      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

      # Encryption for tenant payment credentials
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?required}

      # S3
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_REGION: ${S3_REGION:?set S3_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}

    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./ecommerce-frontend
      args:
        # Browser dynamically uses the hostname being accessed.
        VITE_API_URL: https://{host}/api/v1
        VITE_STORE_DOMAIN: ${PLATFORM_DOMAIN}

    restart: unless-stopped

    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - redis_data:/data
    networks:
      - internal

# =============================================================================
# Volumes
# =============================================================================

volumes:
  redis_data:
  caddy_data:
  caddy_config:

# =============================================================================
# Networks
# =============================================================================

networks:
  # Caddy needs access to the internal services.
  edge:

  # Backend, frontend and Redis communicate internally.
  # The backend still has outbound internet access for SMTP, S3, payment APIs,
  # DNS lookups, etc.
  internal:
