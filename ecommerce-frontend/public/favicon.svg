<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Everystore.

    A filled tile rather than the bare mark: at 16px a transparent glyph sits on
    whatever the browser paints behind it, and the deep green would disappear
    against a dark tab strip. The tile carries the colour, the squares carry the
    idea — many stores, one platform.

    Deliberately simpler than the in-app <EverystoreMark />: three overlapping
    squares turn to mush at favicon size, so this is two plus the tile edge.
  -->
  <rect width="32" height="32" rx="7" fill="#166534"/>
  <rect x="7" y="7" width="13" height="13" rx="3.5" fill="#FFFFFF" opacity="0.45"/>
  <rect x="13" y="13" width="12" height="12" rx="3.5" fill="#F5A524"/>
</svg>
